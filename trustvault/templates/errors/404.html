{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 540px; margin: 3rem auto; padding: 3rem 1.5rem;">
    <h1 style="font-size: 3rem; font-weight: 800; color: var(--color-primary);">404</h1>
    <h2 class="card-title" style="margin: 0.5rem 0 1rem;">Resource Not Found</h2>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">
        The requested resource does not exist or is not accessible within your authorized organization context.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
