{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 540px; margin: 3rem auto; padding: 3rem 1.5rem;">
    <h1 style="font-size: 3rem; font-weight: 800; color: var(--color-warning);">400</h1>
    <h2 class="card-title" style="margin: 0.5rem 0 1rem;">Bad Request</h2>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">
        The request was malformed or CSRF token validation failed. State-changing requests must be submitted with a valid security token.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Safety</a>
</div>
{% endblock %}
