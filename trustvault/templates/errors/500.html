{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 540px; margin: 3rem auto; padding: 3rem 1.5rem;">
    <h1 style="font-size: 3rem; font-weight: 800; color: var(--color-danger);">500</h1>
    <h2 class="card-title" style="margin: 0.5rem 0 1rem;">Internal Server Error</h2>
    <p style="color: var(--color-text-muted); margin-bottom: 2rem;">
        An unexpected error occurred. For your security, detailed debugging information is suppressed in production. The incident has been noted.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Safety</a>
</div>
{% endblock %}
